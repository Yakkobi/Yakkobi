<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- pixel sparkle symbols, built from blocky rects to match the retro pixel-art look -->
    <g id="spark-lg">
      <rect x="-1" y="-9" width="2" height="6" fill="currentColor"/>
      <rect x="-1" y="3"  width="2" height="6" fill="currentColor"/>
      <rect x="-9" y="-1" width="6" height="2" fill="currentColor"/>
      <rect x="3"  y="-1" width="6" height="2" fill="currentColor"/>
      <rect x="-2" y="-2" width="4" height="4" fill="#ffffff"/>
    </g>
    <g id="spark-md">
      <rect x="-1" y="-6" width="2" height="4" fill="currentColor"/>
      <rect x="-1" y="2"  width="2" height="4" fill="currentColor"/>
      <rect x="-6" y="-1" width="4" height="2" fill="currentColor"/>
      <rect x="2"  y="-1" width="4" height="2" fill="currentColor"/>
      <rect x="-1.5" y="-1.5" width="3" height="3" fill="#ffffff"/>
    </g>
    <g id="spark-sm">
      <rect x="-1" y="-1" width="2" height="2" fill="#ffffff"/>
    </g>
  </defs>

  <style>
    .sparkle {
      color: #6fb3ff;
      transform-box: fill-box;
      transform-origin: center;
      animation-name: fall, twinkle;
      animation-iteration-count: infinite;
      animation-timing-function: linear, ease-in-out;
    }
    @keyframes fall {
      0%   { transform: translateY(-20px); }
      100% { transform: translateY(200px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 1; }
    }
  </style>

  <!-- large sparkles -->
  <use href="#spark-lg" class="sparkle" x="60"  y="0" style="animation-duration:6.5s,1.8s; animation-delay:0s,0s;"/>
  <use href="#spark-lg" class="sparkle" x="220" y="0" style="animation-duration:7.2s,2.1s; animation-delay:1.4s,0.3s;"/>
  <use href="#spark-lg" class="sparkle" x="410" y="0" style="animation-duration:5.8s,1.6s; animation-delay:2.6s,0.6s;"/>
  <use href="#spark-lg" class="sparkle" x="600" y="0" style="animation-duration:6.9s,2.0s; animation-delay:0.8s,0.9s;"/>
  <use href="#spark-lg" class="sparkle" x="790" y="0" style="animation-duration:7.6s,1.7s; animation-delay:3.2s,0.2s;"/>

  <!-- medium sparkles -->
  <use href="#spark-md" class="sparkle" x="120" y="0" style="animation-duration:5.4s,1.4s; animation-delay:0.5s,0.1s;"/>
  <use href="#spark-md" class="sparkle" x="310" y="0" style="animation-duration:6.1s,1.5s; animation-delay:2.0s,0.4s;"/>
  <use href="#spark-md" class="sparkle" x="500" y="0" style="animation-duration:5.0s,1.3s; animation-delay:1.1s,0.7s;"/>
  <use href="#spark-md" class="sparkle" x="680" y="0" style="animation-duration:6.6s,1.6s; animation-delay:3.6s,0.5s;"/>
  <use href="#spark-md" class="sparkle" x="850" y="0" style="animation-duration:5.7s,1.4s; animation-delay:1.8s,0.8s;"/>

  <!-- small dot sparkles -->
  <use href="#spark-sm" class="sparkle" x="40"  y="0" style="animation-duration:4.5s,1.0s; animation-delay:0.2s,0.1s;"/>
  <use href="#spark-sm" class="sparkle" x="160" y="0" style="animation-duration:4.9s,1.1s; animation-delay:1.5s,0.3s;"/>
  <use href="#spark-sm" class="sparkle" x="270" y="0" style="animation-duration:4.2s,0.9s; animation-delay:2.3s,0.6s;"/>
  <use href="#spark-sm" class="sparkle" x="360" y="0" style="animation-duration:5.1s,1.2s; animation-delay:0.7s,0.2s;"/>
  <use href="#spark-sm" class="sparkle" x="460" y="0" style="animation-duration:4.4s,1.0s; animation-delay:1.9s,0.5s;"/>
  <use href="#spark-sm" class="sparkle" x="550" y="0" style="animation-duration:4.8s,1.1s; animation-delay:2.8s,0.4s;"/>
  <use href="#spark-sm" class="sparkle" x="650" y="0" style="animation-duration:4.3s,0.9s; animation-delay:0.4s,0.7s;"/>
  <use href="#spark-sm" class="sparkle" x="730" y="0" style="animation-duration:5.3s,1.2s; animation-delay:3.0s,0.3s;"/>
  <use href="#spark-sm" class="sparkle" x="820" y="0" style="animation-duration:4.6s,1.0s; animation-delay:1.2s,0.6s;"/>
  <use href="#spark-sm" class="sparkle" x="880" y="0" style="animation-duration:4.7s,1.1s; animation-delay:2.5s,0.2s;"/>
</svg>
